[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conformalrisk"
version = "0.1.0"
description = "Distribution-free uncertainty for quant risk: conformal VaR with finite-sample coverage, adaptive recalibration, and the Kupiec backtest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sandeep Singh Rai" }]
keywords = ["quantitative-finance", "risk-management", "value-at-risk", "conformal-prediction", "uncertainty-quantification", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/WatchTree-19/conformalrisk"

[tool.setuptools.packages.find]
include = ["conformalrisk*"]
